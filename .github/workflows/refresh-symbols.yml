# Rebuilds the symbol and sector files every Saturday and commits them if they
# changed; Vercel deploys the commit like any other. See CLAUDE.md, Commands.
#
# The two markets run independently: if a source refuses GitHub's machines,
# the other half still lands, and the job then fails so GitHub emails the owner.
# A source that answers with too little cannot replace a good file — each
# builder refuses to write a list more than a tenth smaller than the last.
#
# BSE ANSWERS 403 FROM HERE (first run, 23 Nov 2026); NSE does not. So India's
# BSE rows are carried over from the last build (see src/lib/symbolBuild.js,
# which flags it as a warning, not a failure) and India's SECTORS are not run
# at all: they are read from BSE scrip by scrip, and 5,000 refusals would take
# four minutes to change nothing. Both stay local commands — npm run symbols
# and npm run sectors from a machine BSE answers, every month or two.
#
# No secrets: everything fetched is public, and the repo is public too, so the
# commit step names the five files it may touch and never adds anything else.

name: Refresh symbols

on:
  schedule:
    - cron: "30 2 * * 6"   # Saturday 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-symbols
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: India symbols
        id: in_sym
        continue-on-error: true
        run: npm run symbols

      - name: US symbols
        id: us_sym
        continue-on-error: true
        run: npm run symbols:us

      - name: US sectors
        id: us_sec
        if: steps.us_sym.outcome == 'success'
        continue-on-error: true
        run: npm run sectors:us

      - name: Probes
        run: npm run probe

      - name: Probes, west of Greenwich
        run: npm run probe:tz

      - name: Commit what changed
        run: |
          git add public/symbols.json public/symbols.us.json public/sectors.json public/sectors.us.json public/renames.json
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Symbols and sectors refreshed (weekly job)"
          git push

      # After the commit, so a good half is never held back by a bad one.
      - name: Fail if a market did not refresh
        if: >-
          steps.in_sym.outcome != 'success' ||
          steps.us_sym.outcome != 'success' || steps.us_sec.outcome != 'success'
        run: |
          echo "India symbols: ${{ steps.in_sym.outcome }}"
          echo "US symbols: ${{ steps.us_sym.outcome }} · sectors: ${{ steps.us_sec.outcome }}"
          exit 1
